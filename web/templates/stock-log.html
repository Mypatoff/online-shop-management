{{define "content"}}
<div class="page-header">
	<h1>{{t "stocklog.title"}}</h1>
</div>

<div class="toolbar">
	<label class="field-inline">
		<span>{{t "stocklog.product"}}</span>
		<select id="product-filter"></select>
	</label>
</div>

<p id="stock-log-empty" class="empty hidden">{{t "stocklog.empty"}}</p>

<div class="table-scroll" id="stock-log-wrap">
	<table class="data-table" id="stock-log-table">
		<thead>
			<tr>
				<th>{{t "stocklog.col_time"}}</th>
				<th>{{t "stocklog.col_product"}}</th>
				<th>{{t "stocklog.col_type"}}</th>
				<th>{{t "stocklog.col_change"}}</th>
				<th>{{t "stocklog.col_after"}}</th>
				<th>{{t "stocklog.col_reason"}}</th>
				<th>{{t "stocklog.col_note"}}</th>
			</tr>
		</thead>
		<tbody id="stock-log-tbody"></tbody>
	</table>
</div>

<div class="toolbar">
	<button type="button" id="load-more-btn" class="btn btn-secondary hidden">{{t "stocklog.load_more"}}</button>
</div>
{{end}}
