{{define "content"}}
<div class="page-header">
	<h1>Products</h1>
	<button type="button" id="add-product-btn" class="btn btn-primary">Add product</button>
</div>

<div class="toolbar">
	<input type="search" id="search-input" placeholder="Search by name or SKU" aria-label="Search products">
	<label class="checkbox">
		<input type="checkbox" id="show-archived-input">
		Show archived
	</label>
</div>

<p id="products-empty" class="empty hidden">
	<span id="products-empty-message">No products yet.</span>
	<button type="button" id="add-product-btn-empty" class="btn btn-primary">Add your first product</button>
</p>

<div class="table-scroll">
	<table class="data-table" id="products-table">
		<thead>
			<tr>
				<th>Name</th>
				<th>SKU</th>
				<th>Price</th>
				<th>Stock</th>
				<th></th>
			</tr>
		</thead>
		<tbody id="products-tbody"></tbody>
	</table>
</div>
{{end}}
