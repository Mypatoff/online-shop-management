{{define "content"}}
<div class="no-print">
	<h1>Billiard</h1>

	<section class="panel">
		<h2>New entry</h2>
		<form id="billiard-entry-form">
			<label class="field">
				<span>Amount</span>
				<input type="text" id="billiard-amount-input" class="billiard-amount-input" inputmode="decimal" autocomplete="off" aria-label="Amount">
			</label>

			<label class="field">
				<span>Table</span>
				<input type="text" id="billiard-table-input" list="billiard-table-suggestions" autocomplete="off" aria-label="Table">
				<datalist id="billiard-table-suggestions"></datalist>
			</label>

			<label class="field">
				<span>Minutes (optional)</span>
				<input type="text" id="billiard-minutes-input" inputmode="numeric" autocomplete="off" aria-label="Minutes">
			</label>

			<label class="field">
				<span>Note (optional)</span>
				<input type="text" id="billiard-note-input" autocomplete="off" aria-label="Note">
			</label>

			<button type="submit" id="billiard-save-btn" class="btn btn-sell">SAVE</button>
			<p id="billiard-entry-error" class="error" role="alert"></p>
		</form>
	</section>

	<div class="toolbar">
		<label class="field-inline">
			<span>Date</span>
			<input type="date" id="billiard-date-input">
		</label>
		<button type="button" id="billiard-prev-day-btn" class="btn btn-secondary btn-small">◀ Previous</button>
		<button type="button" id="billiard-next-day-btn" class="btn btn-secondary btn-small">Next ▶</button>
	</div>

	<section class="stats-grid stats-grid-compact">
		<div class="stat-card">
			<div class="stat-label">Revenue</div>
			<div class="stat-value" id="billiard-day-revenue">—</div>
		</div>
		<div class="stat-card">
			<div class="stat-label">Entries</div>
			<div class="stat-value" id="billiard-day-count">—</div>
		</div>
	</section>

	<h2>Entries</h2>
	<p id="billiard-empty" class="empty hidden">No billiard entries on this day.</p>
	<div class="table-scroll" id="billiard-wrap">
		<table class="data-table" id="billiard-table">
			<thead>
				<tr>
					<th>Time</th>
					<th>Table</th>
					<th>Minutes</th>
					<th>Note</th>
					<th>Amount</th>
					<th>Status</th>
					<th></th>
				</tr>
			</thead>
			<tbody id="billiard-tbody"></tbody>
		</table>
	</div>
</div>

<div id="billiard-receipt" class="print-only"></div>
<div id="toast" class="toast hidden" role="status"></div>
{{end}}
