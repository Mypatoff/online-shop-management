{{define "content"}}
<h1>{{t "sell.title"}}</h1>

<section class="panel">
	<label class="field">
		<span>{{t "sell.search"}}</span>
		<input type="search" id="sell-search" placeholder="{{t "products.search_placeholder"}}" aria-label="{{t "products.search_label"}}">
	</label>
	<ul id="sell-results" class="sell-results"></ul>

	<div id="sell-selected" class="sell-selected hidden">
		<div class="selected-name" id="selected-name"></div>
		<div class="selected-price" id="selected-price"></div>

		<div class="stepper">
			<button type="button" id="qty-dec" class="btn btn-secondary btn-small" aria-label="{{t "sell.qty_dec"}}">−</button>
			<input type="number" id="qty-input" value="1" min="1" step="1" aria-label="{{t "sell.quantity"}}">
			<button type="button" id="qty-inc" class="btn btn-secondary btn-small" aria-label="{{t "sell.qty_inc"}}">+</button>
		</div>

		<div class="cups-row">
			<span class="cups-label">{{t "sell.cups"}}</span>
			<div class="stepper">
				<button type="button" id="cups-dec" class="btn btn-secondary btn-small" aria-label="{{t "sell.cups_dec"}}">−</button>
				<input type="number" id="cups-input" value="0" min="0" max="1000" step="1" aria-label="{{t "sell.cups"}}">
				<button type="button" id="cups-inc" class="btn btn-secondary btn-small" aria-label="{{t "sell.cups_inc"}}">+</button>
			</div>
			<span class="cups-price" id="cups-price"></span>
			<button type="button" id="cup-price-btn" class="btn btn-ghost btn-small">{{t "sell.cup_price_set"}}</button>
		</div>

		<p class="sell-total">{{t "sell.total"}} <span id="sell-total">—</span></p>

		<button type="button" id="sell-btn" class="btn btn-sell">{{t "sell.sell"}}</button>
		<p id="sell-error" class="error" role="alert"></p>
	</div>
</section>

<section class="panel">
	<h2>{{t "sell.recent"}}</h2>
	<p id="recent-sales-empty" class="empty hidden">{{t "sell.recent_empty"}}</p>
	<ul id="recent-sales-list" class="recent-sales-list"></ul>
</section>
{{end}}
