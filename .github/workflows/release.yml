# Builds the Windows installer when a version tag is pushed, and attaches it to the
# GitHub release for that tag (the "Releases" / tags page).
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# A manual run (Actions -> Release -> Run workflow) builds the same files and keeps
# them as a downloadable artifact of the run, without creating a release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # to create the release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          go vet ./...
          go test ./...

      # Inno Setup 6 is on GitHub's Windows images; this only installs it if that changes.
      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "Inno Setup 6 is not installed" }

      # v1.2.3 -> 1.2.3. The installer's version must be numeric, so a tag like v1.2.3-rc1
      # is built as 1.2.3.
      - name: Version
        id: version
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          if ($ref -match '^v?(\d+\.\d+\.\d+)') { $v = $Matches[1] } else { $v = "0.0.0" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build ShopKeeper.exe and ShopKeeper-Setup.exe
        shell: pwsh
        run: ./installer/build-installer.ps1 -Version ${{ steps.version.outputs.version }}

      # The app's "Update" button downloads ShopKeeper.exe (or shopkeeper-linux) and refuses it unless
      # it matches this list, so a damaged or swapped download is never installed.
      - name: Checksums
        shell: pwsh
        run: |
          $lines = foreach ($f in "ShopKeeper-Setup.exe", "ShopKeeper.exe", "shopkeeper-linux") {
            "{0}  {1}" -f (Get-FileHash "dist/$f" -Algorithm SHA256).Hash.ToLower(), $f
          }
          [IO.File]::WriteAllText("$PWD/dist/SHA256SUMS.txt", ($lines -join "`n") + "`n")
          Get-Content dist/SHA256SUMS.txt

      - name: Files
        shell: pwsh
        run: Get-ChildItem dist | Select-Object Name, Length

      - name: Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag like v1.2.0-beta.1 is a pre-release: it is not "latest", so the app's Update
          # button never offers it.
          $flags = @()
          if ("${{ github.ref_name }}" -match '-') { $flags += "--prerelease" }
          gh release create "${{ github.ref_name }}" `
            dist/ShopKeeper-Setup.exe dist/ShopKeeper.exe dist/shopkeeper-linux dist/SHA256SUMS.txt `
            --title "ShopKeeper ${{ github.ref_name }}" `
            --generate-notes `
            --verify-tag `
            @flags

      - name: Keep the files (manual run)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ShopKeeper-windows
          path: |
            dist/ShopKeeper-Setup.exe
            dist/ShopKeeper.exe
            dist/SHA256SUMS.txt

  # The Linux package (installer script, menu launcher, icons) is built on Linux so the scripts
  # keep their executable bits. It is added to the release the windows job created.
  linux-package:
    if: github.ref_type == 'tag'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write # to add a file to the release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the package
        env:
          REF: ${{ github.ref_name }}
        run: |
          VERSION="${REF#v}" ./build.sh
          ls -l dist

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/ShopKeeper-linux.tar.gz --clobber
